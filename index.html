<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Джарвис</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 18px; padding: 20px;
           background: #0b1020; color: #e8f0ff; font-family: sans-serif; text-align: center; }
    h1 { font-size: 26px; margin: 0; }
    button { font-size: 18px; padding: 16px 28px; border: 0; border-radius: 16px;
             background: #3b82f6; color: white; }
    #ask { background: #22c55e; }
    #status { font-size: 18px; min-height: 26px; }
    #report { max-width: 340px; font-size: 16px; line-height: 1.4; color: #c9d6f5; }
    .bar { width: 260px; height: 14px; background: #1c2540; border-radius: 7px; overflow: hidden; }
    #level { height: 100%; width: 0%; background: #22c55e; }
    input[type=range] { width: 260px; }
    small { color: #8a96b8; }
  </style>
</head>
<body>
  <h1>🤖 Джарвис</h1>
  <button id="start">Включить прослушивание</button>
  <button id="ask">Что зашло лучше всего?</button>
  <div id="status">Выключен</div>
  <div id="report"></div>

  <div class="bar"><div id="level"></div></div>
  <small>Громкость звука вокруг</small>
  <label>
    <small>Чувствительность к хлопку</small><br>
    <input type="range" id="sens" min="1" max="10" value="5">
  </label>

  <script>
    const statusEl = document.getElementById("status");
    const reportEl = document.getElementById("report");
    const levelEl = document.getElementById("level");
    const sensEl = document.getElementById("sens");
    const startBtn = document.getElementById("start");
    const askBtn = document.getElementById("ask");

    let lastClap = 0;
    let busy = false;

    function say(text) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ru-RU";
      u.volume = 1;
      speechSynthesis.speak(u);
    }

    const TYPES = { IMAGE: "фото", VIDEO: "видео", CAROUSEL_ALBUM: "карусель" };

    function cleanCaption(s) {
      return (s || "").replace(/[^\p{L}\p{N}\s.,!?-]/gu, "").trim().slice(0, 80);
    }

    async function tellBest() {
      if (busy) return;
      busy = true;
      statusEl.textContent = "Смотрю твои публикации…";
      say("Секунду, смотрю статистику.");
      let text;
      try {
        const r = await fetch("/api/media");
        const posts = await r.json();
        if (!r.ok || posts.error) throw new Error("api");
        if (!posts.length) throw new Error("empty");

        const score = p => (p.like_count || 0) + 3 * (p.comments_count || 0);
        const best = posts.slice().sort((a, b) => score(b) - score(a))[0];

        const groups = {};
        posts.forEach(p => {
          const t = p.media_type;
          groups[t] = groups[t] || { sum: 0, n: 0 };
          groups[t].sum += p.like_count || 0;
          groups[t].n += 1;
        });
        let bestType = null, bestAvg = 0;
        Object.keys(groups).forEach(t => {
          const avg = Math.round(groups[t].sum / groups[t].n);
          if (avg > bestAvg) { bestAvg = avg; bestType = t; }
        });

        const date = new Date(best.timestamp).toLocaleDateString("ru-RU",
          { day: "numeric", month: "long", year: "numeric" });
        const cap = cleanCaption(best.caption);

        text = "Лучше всего зашёл пост типа " + (TYPES[best.media_type] || "публикация") +
          " от " + date + ": " + (best.like_count || 0) + " лайков и " +
          (best.comments_count || 0) + " комментариев." +
          (cap ? " Подпись: " + cap + "." : "") +
          " Если смотреть по типам, самые удачные у тебя " +
          (bestType === "IMAGE" ? "фото" : bestType === "VIDEO" ? "видео" : "карусели") +
          ": в среднем около " + bestAvg + " лайков.";
      } catch (e) {
        text = "Не получилось получить данные из Инстаграма. Попробуй ещё раз позже.";
      }
      reportEl.textContent = text;
      statusEl.textContent = "Жду хлопок…";
      say(text);
      setTimeout(() => { busy = false; }, 3000);
    }

    askBtn.onclick = tellBest;

    function onClap() {
      statusEl.textContent = "👏 Хлопок! Я слушаю";
      tellBest();
    }

    startBtn.onclick = async () => {
      const warm = new SpeechSynthesisUtterance(" ");
      warm.volume = 0; speechSynthesis.speak(warm);
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        try { await navigator.wakeLock.request("screen"); } catch (e) {}

        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === "suspended") await ctx.resume();
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        ctx.createMediaStreamSource(stream).connect(analyser);
        const data = new Uint8Array(analyser.fftSize);

        let baseline = 0.02;
        startBtn.style.display = "none";
        statusEl.textContent = "Жду хлопок…";
        say("Я готов. Хлопни в ладоши.");

        function loop() {
          analyser.getByteTimeDomainData(data);
          let peak = 0;
          for (let i = 0; i < data.length; i++) {
            const v = Math.abs(data[i] - 128) / 128;
            if (v > peak) peak = v;
          }
          levelEl.style.width = Math.min(100, peak * 100) + "%";

          const threshold = 0.9 - sensEl.value * 0.07;
          const now = Date.now();
          const talking = speechSynthesis.speaking;

          if (!talking && !busy && peak > threshold && peak > baseline * 4 && now - lastClap > 2000) {
            lastClap = now;
            onClap();
          }
          baseline = baseline * 0.98 + peak * 0.02;
          requestAnimationFrame(loop);
        }
        loop();
      } catch (e) {
        statusEl.textContent = "Нет доступа к микрофону. Разреши его в настройках браузера.";
      }
    };
  </script>
</body>
</html>
